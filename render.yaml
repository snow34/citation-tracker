databases:
  - name: citation-tracker-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: citation-tracker
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citation-tracker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CROSSREF_BASE_URL
        value: https://api.crossref.org
      - key: CROSSREF_MAILTO
        value: you@example.com
      - key: ALLOWED_ORIGINS
        value: "https://snow34.github.io"
